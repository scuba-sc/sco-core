# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "scl-install"
description = "Install folder layout, discovery, status, plugin list, enable and disable, and verified plugin install from a local zip (no UI, no network, never loads plugin code)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
scl-config = { path = "../scl-config" }
scl-contract = { path = "../scl-contract" }
scl-plugins = { path = "../scl-plugins" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
