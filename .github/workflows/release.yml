name: release

# Promote a previously built main candidate; never rebuild its release bytes.
# The protected release environment remains the authorization boundary.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SDK tag pointing at the candidate source
        required: true
        type: string
      run_id:
        description: Successful release-candidate run ID
        required: true
        type: string
      artifact_id:
        description: Immutable release-candidate artifact ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Resolve the existing tag and its source commit.

      - name: Require main dispatch and an existing tag at this exact source
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Download the exact candidate and generate its inventory
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_promote.py fetch

      - name: Verify the candidate inventory, profiles, checksums and bytes
        run: |
          python3 tools/release_verify.py verify --manifest release.json --payload-dir payload \
            --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID"

      - name: Verify provenance for every candidate payload file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in payload/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          done

      - name: Transfer only the verified bytes to publish
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-payload
          path: |
            payload/*
            release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: transfer

      - name: Restore the verified inventory and payload
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          mv transfer/release.json release.json
          mv transfer/payload payload

      - name: The tag matches sdk/VERSION and has a CHANGELOG section
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          if ! python3 -c 'import sys; from tools.doc_release_gate import base_tag; sys.exit(base_tag(sys.argv[1]) != "sdk-v" + sys.argv[2])' "$RELEASE_TAG" "$v"; then
            echo "tag $RELEASE_TAG does not match sdk/VERSION ($v)"; exit 1
          fi
          awk -v t="sdk-v$v" '
            $0 ~ "^## " { if (on) exit; if (index($0, "## " t " ") == 1 || $0 == "## " t) { on = 1; next } }
            on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no '## $RELEASE_TAG' section"; exit 1
          fi
          if [ "$RELEASE_TAG" != "sdk-v$v" ]; then
            { printf 'Release candidate %s; not the final SDK release.\n\n' "$RELEASE_TAG"; cat "$RUNNER_TEMP/notes.md"; } > "$RUNNER_TEMP/candidate-notes.md"
            mv "$RUNNER_TEMP/candidate-notes.md" "$RUNNER_TEMP/notes.md"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Re-check the transfer, create a complete draft, and verify the downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_verify.py verify --manifest release.json --payload-dir payload \
            --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python3 tools/release_promote.py draft
          python3 tools/release_verify.py verify --manifest release.json --payload-dir downloaded \
            --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --run-id "$RUN_ID" --artifact-id "$ARTIFACT_ID"
          # Failure leaves an unpublished draft for investigation.

      - name: Publish only the same unique, verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          python3 tools/release_promote.py publish

  notify:
    needs: publish
    if: ${{ !contains(inputs.tag, '-rc.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # read prior attempt markers and receipts
    concurrency:
      group: release-notify-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The tag and main's deployed Pages commit.

      - name: Verify release completion and the prior delivery state
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/release_notify.py prepare --tag "$RELEASE_TAG" --work "$RUNNER_TEMP/release-notify"

      - name: Persist the delivery-attempt marker before posting
        id: marker
        if: steps.prepare.outputs.action == 'send'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.attempt-artifact }}
          path: ${{ runner.temp }}/release-notify/attempt.json
          if-no-files-found: error
          retention-days: 90

      - name: Post once and record the outcome
        if: steps.prepare.outputs.action == 'send'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 tools/release_notify.py send --work "$RUNNER_TEMP/release-notify"

      - name: Persist the delivery receipt
        if: always() && steps.marker.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.prepare.outputs.receipt-artifact }}
          path: ${{ runner.temp }}/release-notify/receipt.json
          if-no-files-found: error
          retention-days: 90
