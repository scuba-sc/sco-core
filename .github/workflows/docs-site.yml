name: docs-site

# Build a reviewable static artifact only; publication is a separate decision.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # The event supplies a full commit SHA, not a user-controlled branch/ref name.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build the catalogue for the exact checked-out source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/sdk_catalogue.py build --out dist/sdk-catalogue.json --source-sha "$SOURCE_SHA"

      - name: Generate the documentation source
        run: python3 site/scripts/gen.py

      - name: Install locked site dependencies and build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Validate the built site and refusal checks
        run: python3 site/scripts/test_site.py --built site/dist

      - name: Upload the static documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sco-docs-site
          path: site/dist
          if-no-files-found: error
          retention-days: 14
