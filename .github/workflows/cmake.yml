name: cmake

# The root CMake build and its CTest suite: Linux with clang (ASan + UBSan), and Windows with
# the default Visual Studio generator, MSVC x64. tools/test.sh (test.yml) keeps the TSan runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The #302 parity gate archives a pinned baseline commit.

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSCO_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  # The kernel alone (SCO_GAME_SC=OFF): it must build and pass its tests with no Star Citizen code.
  kernel-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build
          # Include object targets (including header-only ABI pins) in the actual target graph.
          printf '%s\n' 'set(GRAPHVIZ_OBJECT_LIBS TRUE)' > build/CMakeGraphVizOptions.cmake
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Debug \
            -DSCO_SANITIZE=address,undefined -DSCO_GAME_SC=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON --graphviz=build/kernel-targets.dot

      - name: Build
        run: cmake --build build --parallel

      - name: Kernel-only dependency check
        run: |
          python3 tools/test_kernel_dependencies.py
          python3 tools/check_kernel_dependencies.py build

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The #302 parity gate archives a pinned baseline commit.

      - name: MCP stdio profiles and configured execution on Windows
        run: python tools/sco-core-mcp/test_server.py

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure --timeout 300
