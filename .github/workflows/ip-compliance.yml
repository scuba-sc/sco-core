name: ip-compliance

# Release hardening Gates 1-7 (docs/legal/, IP_POLICY.md): provenance coverage, refused artifacts,
# core isolation, licences (REUSE), the SDK zips against sdk/components.json with their SHA256SUMS
# and SPDX SBOMs, reproducible packaging, and the negative tests that prove each check refuses.
# Evidence collection, not a legal opinion. The reports and SBOMs are kept as an artifact.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install reuse and the SPDX validator
        run: python3 -m pip install --no-cache-dir "reuse[charset-normalizer]==6.2.0" "spdx-tools==0.8.3"

      - name: Repository audit (Gates 1, 2, 4)
        run: |
          mkdir -p evidence
          python3 tools/ip_audit.py repo --report evidence/repo-audit.json

      - name: REUSE specification
        run: reuse lint

      - name: Package every profile twice; the bytes must match (Gate 6)
        run: |
          for p in core game-sc legacy; do
            python3 sdk/package.py --profile $p --out dist-a
            python3 sdk/package.py --profile $p --out dist-b
          done
          (cd dist-a && sha256sum *.zip) > evidence/SHA256SUMS
          (cd dist-b && sha256sum *.zip) | diff - evidence/SHA256SUMS

      - name: Audit each zip and write its SBOM (Gates 3, 5, 6)
        run: |
          python3 tools/ip_audit.py zip dist-a/sco-sdk-core-*.zip --profile core --sbom evidence/sco-sdk-core.spdx.json --report evidence/core-audit.json
          python3 tools/ip_audit.py zip dist-a/sco-sdk-game-sc-*.zip --profile game-sc --sbom evidence/sco-sdk-game-sc.spdx.json --report evidence/game-sc-audit.json
          python3 tools/ip_audit.py zip dist-a/sco-sdk-[0-9]*.zip --profile legacy --sbom evidence/sco-sdk-legacy.spdx.json --report evidence/legacy-audit.json
          for s in evidence/*.spdx.json; do pyspdxtools -i "$s"; done

      - name: Negative tests (Gate 7)
        run: python3 tools/test_ip_audit.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ip-compliance-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
