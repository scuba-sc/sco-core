name: ip-compliance

# Release hardening Gates 1-7 (docs/legal/, IP_POLICY.md): provenance coverage, refused artifacts,
# core isolation, licences (REUSE), the SDK zips against sdk/components.json with their SHA256SUMS
# and SPDX SBOMs, reproducible packaging, and the negative tests that prove each check refuses.
# Evidence collection, not a legal opinion. The reports and SBOMs are kept as an artifact.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install reuse and the SPDX validator
        run: python3 -m pip install --no-cache-dir "reuse[charset-normalizer]==6.2.0" "spdx-tools==0.8.3"

      # Before anything is written into the checkout: reuse lint reads every file in it.
      - name: REUSE specification
        run: reuse lint

      - name: Repository audit (Gates 1, 2, 4)
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 tools/ip_audit.py repo --report "$RUNNER_TEMP/evidence/repo-audit.json"

      - name: SDK contract catalogue and refusal tests
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/sdk_catalogue.py check
          python3 tools/test_sdk_catalogue.py
          python3 tools/sdk_catalogue.py build --out "$RUNNER_TEMP/evidence/sdk-catalogue.json" --source-sha "$SOURCE_SHA"
          SCO_CORE_MCP_TEST_CATALOGUE="$RUNNER_TEMP/evidence/sdk-catalogue.json" python3 tools/sco-core-mcp/test_server.py
          python3 tools/sco-core-mcp/test_runtime_schema.py

      - name: Package every profile twice; the bytes must match (Gate 6)
        run: |
          for p in core game-sc legacy; do
            python3 sdk/package.py --profile $p --out "$RUNNER_TEMP/dist-a"
            python3 sdk/package.py --profile $p --out "$RUNNER_TEMP/dist-b"
          done
          (cd "$RUNNER_TEMP/dist-a" && sha256sum ./*.zip) > "$RUNNER_TEMP/evidence/SHA256SUMS"
          (cd "$RUNNER_TEMP/dist-b" && sha256sum ./*.zip) | diff - "$RUNNER_TEMP/evidence/SHA256SUMS"

      - name: Audit each zip and write its SBOM (Gates 3, 5, 6)
        run: |
          python3 tools/ip_audit.py zip "$RUNNER_TEMP/dist-a"/sco-sdk-core-*.zip --profile core --sbom "$RUNNER_TEMP/evidence/sco-sdk-core.spdx.json" --report "$RUNNER_TEMP/evidence/core-audit.json"
          python3 tools/ip_audit.py zip "$RUNNER_TEMP/dist-a"/sco-sdk-game-sc-*.zip --profile game-sc --sbom "$RUNNER_TEMP/evidence/sco-sdk-game-sc.spdx.json" --report "$RUNNER_TEMP/evidence/game-sc-audit.json"
          python3 tools/ip_audit.py zip "$RUNNER_TEMP/dist-a"/sco-sdk-[0-9]*.zip --profile legacy --sbom "$RUNNER_TEMP/evidence/sco-sdk-legacy.spdx.json" --report "$RUNNER_TEMP/evidence/legacy-audit.json"
          for s in "$RUNNER_TEMP"/evidence/*.spdx.json; do pyspdxtools -i "$s"; done

      - name: Negative tests (Gate 7)
        run: |
          python3 tools/test_ip_audit.py
          python3 tools/test_release_verify.py
          python3 tools/test_release_promote.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ip-compliance-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90
