name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-24.04 runs 32-bit mmap ASLR, which ThreadSanitizer from clang 18 can't map around.
      - name: Allow ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Documentation release gate (Gate H)
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          python3 tools/doc_release_gate.py --tag "sdk-v$v"

      - name: Game status registry matches docs/game/status.md
        run: |
          python3 tools/status_registry.py --check
          python3 tools/test_status_registry.py

      - name: Native index matches src/game/*_sigs.cpp
        run: |
          python3 tools/native_index.py --check
          python3 tools/test_native_index.py

      - name: Live-site checker unit tests (offline)
        run: python3 tools/test_check_live_site.py

      - name: Host unit tests
        run: CC=clang CXX=clang++ tools/test.sh

      - name: sco-sigcheck builds
        run: |
          set +e
          CXX=clang++ tools/sigcheck.sh /dev/null
          code=$?
          [ $code -eq 2 ] || { echo "expected exit 2 (not a PE file), got $code"; exit 1; }
