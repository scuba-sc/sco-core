name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  issue302-valid-input-parity:
    name: Issue #302 synthetic valid-input parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tests/issue302_valid_parity.py archives its pinned baseline commit.

      - name: Install explicit GCC 14 compiler
        run: |
          apt_log="${RUNNER_TEMP}/issue302-gcc-install.log"
          if ! { sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-14; } > "$apt_log" 2>&1; then
            tail -n 80 "$apt_log"
            exit 1
          fi
          g++-14 --version | head -n 1

      - name: Run synthetic all-row parity (no game data)
        timeout-minutes: 10
        env:
          CXX: g++-14
        run: |
          report="${RUNNER_TEMP}/issue302-valid-parity"
          log="${RUNNER_TEMP}/issue302-valid-parity.log"
          if python3 tests/issue302_valid_parity.py --out "$report" > "$log" 2>&1; then
            status=0
          else
            status=$?
          fi
          head -c 4096 "$log" || true
          printf '\n'
          exit "$status"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The #302 parity gate archives a pinned baseline commit.

      # ubuntu-24.04 runs 32-bit mmap ASLR, which ThreadSanitizer from clang 18 can't map around.
      - name: Allow ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Documentation release gate (Gate H)
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          python3 tools/doc_release_gate.py --tag "sdk-v$v"

      - name: Game status registry matches docs/game/status.md
        run: |
          python3 tools/status_registry.py --check
          python3 tools/test_status_registry.py

      - name: Plugin directory index matches docs/plugin-directory.md
        run: |
          python3 tools/plugin_directory.py --check
          python3 tools/test_plugin_directory.py

      - name: Native index matches src/game/*_sigs.cpp
        run: |
          python3 tools/native_index.py --check
          python3 tools/test_native_index.py

      - name: Live-site checker unit tests (offline)
        run: python3 tools/test_check_live_site.py

      - name: Host unit tests
        run: CC=clang CXX=clang++ tools/test.sh

      - name: sco-sigcheck builds
        run: |
          set +e
          CXX=clang++ tools/sigcheck.sh /dev/null
          code=$?
          [ $code -eq 2 ] || { echo "expected exit 2 (not a PE file), got $code"; exit 1; }
