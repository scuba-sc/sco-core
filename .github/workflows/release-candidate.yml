name: release-candidate

# Build once on the selected main commit, after every mandatory check succeeds on that SHA.
# Dispatch with the prospective sdk-v<version> tag (no tag is created here). The single immutable
# release-candidate artifact contains all five SDK archives, their SBOMs and SHA256SUMS.
# Copy its run ID, artifact ID, file sizes and hashes from the summary into release.json, review,
# sign and commit the approval, then tag. release.yml promotes those exact bytes without rebuilding.
# Repository access is read-only; only candidate can mint provenance attestations, not releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prospective SDK tag matching sdk/VERSION (sdk-v<version>)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read check runs and their owning workflow runs, never just an ambiguous job name.
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation readiness gate (Gate H)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/doc_release_gate.py --tag "$RELEASE_TAG"

      # Includes docs-site/docs-site: the site built and validated from this exact main SHA.
      - name: Require successful mandatory workflows on the exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_promote.py prerequisites

  candidate:
    needs: prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the prospective tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          test "$RELEASE_TAG" = "sdk-v$v" || { echo 'tag does not match sdk/VERSION'; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Repository audit
        run: python3 tools/ip_audit.py repo

      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Package every profile and audit each archive with its own SBOM
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          gp=$(sed -n 's/^#define SCO_GAME_PACK_VERSION "\([0-9.]*\)"$/\1/p' include/sc_game_pack.h)
          test -n "$gp" || { echo 'SCO_GAME_PACK_VERSION not found in include/sc_game_pack.h'; exit 1; }
          for profile in core game-sc legacy core-source host-source-sc; do
            python3 sdk/package.py --profile "$profile" --out dist
            if [ "$profile" = legacy ]; then
              archive="dist/sco-sdk-$v.zip"
            elif [ "$profile" = game-sc ]; then
              archive="dist/sco-sdk-game-sc-$gp.zip"
            else
              archive="dist/sco-sdk-$profile-$v.zip"
            fi
            python3 tools/ip_audit.py zip "$archive" --profile "$profile" --sbom "${archive%.zip}.spdx.json"
          done

      - name: Exercise each archive (game-sc is an overlay on core)
        env:
          SCO_SDK_CSHARP: "1"
          CC: clang
          CXX: clang++
        run: |
          v=$(tr -d '\r\n' < sdk/VERSION)
          gp=$(sed -n 's/^#define SCO_GAME_PACK_VERSION "\([0-9.]*\)"$/\1/p' include/sc_game_pack.h)
          test -n "$gp" || { echo 'SCO_GAME_PACK_VERSION not found in include/sc_game_pack.h'; exit 1; }
          sdk/test-zip.sh "dist/sco-sdk-core-$v.zip"
          sdk/test-zip.sh "dist/sco-sdk-core-$v.zip" "dist/sco-sdk-game-sc-$gp.zip"
          sdk/test-zip.sh "dist/sco-sdk-$v.zip"
          sdk/test-zip.sh "dist/sco-sdk-core-source-$v.zip"
          SCO_HOST_SOURCE_ARCHIVE="dist/sco-sdk-host-source-sc-$v.zip" \
            python3 sdk/test_host_source.py HostSourceArchive.test_standalone_game_source_archive -v

      - name: Inventory the complete release payload
        run: python3 tools/release_verify.py inventory --payload-dir dist --out dist/SHA256SUMS

      - name: Attest every payload file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload the immutable candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Approval inputs (copy every file, including SHA256SUMS)
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 tools/release_promote.py summary
